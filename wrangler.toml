name = "open-intelligence"
pages_build_output_dir = "."
compatibility_date = "2026-10-12"

# Secrets (set with `wrangler pages secret put <NAME> --project-name open-intelligence`, never here):
#   SESSION_SECRET     HMAC key for the oi_session login cookie (functions/_shared/session.js)
#   AUTH_USERS         JSON [{u, salt, hash}] for /api/login (PBKDF2-SHA256, 100k iterations)

# Waitlist store for functions/api/waitlist.js (see README, "How the waitlist works").
# Keys: "email:<address>" -> {email, note, ts, ua, ip_hash}; "by_ts:<ts>:<hash>" -> address (export
# index); "rl:<ip hash>:<hour>" -> count (rate limit, expires after 2 h). Export with
# scripts/waitlist_export.sh. The namespace id is not a secret; access needs a Cloudflare API token.
[[kv_namespaces]]
binding = "OI_WAITLIST"
id = "33345be23dbb4bc2b3e260f3b50cfe41"
